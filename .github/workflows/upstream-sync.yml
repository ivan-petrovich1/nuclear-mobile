name: Upstream Sync (nukeop/nuclear)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch upstream and attempt non-destructive merge
        id: merge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/nukeop/nuclear.git
          else
            git remote add upstream https://github.com/nukeop/nuclear.git
          fi

          git fetch upstream master

          NEW_COUNT=$(git rev-list --count HEAD..upstream/master)
          if [ "$NEW_COUNT" -eq 0 ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with nukeop/nuclear."
            exit 0
          fi

          UPSTREAM_SHA=$(git rev-parse --short upstream/master)
          MERGE_BASE=$(git merge-base --short HEAD upstream/master || echo "unknown")

          NON_TRANS_TOTAL=$(git rev-list --count --no-merges --grep='^New translations ' --invert-grep HEAD..upstream/master)
          TRANS_TOTAL=$(git rev-list --count --no-merges --grep='^New translations ' HEAD..upstream/master)

          {
            git log -n 50 --no-merges --grep='^New translations ' --invert-grep --pretty=format:'- `%h` %s' HEAD..upstream/master
            echo ""
            if [ "$NON_TRANS_TOTAL" -gt 50 ]; then
              OMITTED=$((NON_TRANS_TOTAL - 50))
              echo "- _...and ${OMITTED} more feature/fix commit(s)._"
            fi
            if [ "$TRANS_TOTAL" -gt 0 ]; then
              echo "- _Plus ${TRANS_TOTAL} Crowdin translation update commit(s)._"
            fi
          } > /tmp/upstream-commits.md

          git checkout -B upstream-sync main
          git merge --no-commit --no-ff upstream/master || true

          INITIAL_CONFLICTS=$(git diff --name-only --diff-filter=U)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [[ "$f" =~ ^packages/(docs|website|storybook)/ ]] && ! git cat-file -e "HEAD:$f" 2>/dev/null; then
              git rm -rf --ignore-unmatch -- "$f" >/dev/null
            fi
          done <<< "$INITIAL_CONFLICTS"

          REMAINING=$(git diff --name-only --diff-filter=U)
          if [ -z "$REMAINING" ]; then
            git commit -m "chore(upstream): sync ${NEW_COUNT} commits from nukeop/nuclear (${UPSTREAM_SHA})"
            git push --force origin upstream-sync
            {
              echo "has_updates=true"
              echo "status=clean"
              echo "new_count=${NEW_COUNT}"
              echo "upstream_sha=${UPSTREAM_SHA}"
              echo "merge_base=${MERGE_BASE}"
            } >> "$GITHUB_OUTPUT"
          else
            CLEAN_COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
            SRC_CONFLICTS=""
            LOCK_SNAP_CONFLICTS=""

            while IFS= read -r f; do
              [ -z "$f" ] && continue
              base_name=$(basename "$f")
              if [[ "$f" == *.snap ]] || [ "$base_name" = "Cargo.lock" ] || [ "$base_name" = "pnpm-lock.yaml" ]; then
                LOCK_SNAP_CONFLICTS="${LOCK_SNAP_CONFLICTS}"$'\n'"- \`${f}\`"
              else
                SRC_CONFLICTS="${SRC_CONFLICTS}"$'\n'"- \`${f}\`"
              fi
            done <<< "$REMAINING"

            {
              echo "### Source / Config Conflicts"
              if [ -n "$SRC_CONFLICTS" ]; then
                echo "$SRC_CONFLICTS" | sed '/^$/d'
              else
                echo "_None_"
              fi
              echo ""
              echo "### Lockfiles & Test Snapshots"
              if [ -n "$LOCK_SNAP_CONFLICTS" ]; then
                echo "$LOCK_SNAP_CONFLICTS" | sed '/^$/d'
              else
                echo "_None_"
              fi
            } > /tmp/conflict-details.md

            git merge --abort
            git checkout main

            {
              echo "has_updates=true"
              echo "status=conflicts"
              echo "new_count=${NEW_COUNT}"
              echo "upstream_sha=${UPSTREAM_SHA}"
              echo "merge_base=${MERGE_BASE}"
              echo "clean_count=${CLEAN_COUNT}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PNPM
        if: steps.merge.outputs.status == 'clean'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.merge.outputs.status == 'clean'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies and build workspace packages
        if: steps.merge.outputs.status == 'clean'
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile
          pnpm turbo build --filter='@nuclearplayer/player^...'

      - name: Run player tests on merged branch
        id: tests
        if: steps.merge.outputs.status == 'clean'
        continue-on-error: true
        shell: bash
        run: pnpm --filter @nuclearplayer/player test

      - name: Open or update clean upstream sync PR
        if: steps.merge.outputs.status == 'clean'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create upstream-sync --color 1D76DB --description "Automated upstream sync from nukeop/nuclear" --force

          TEST_OUTCOME="${{ steps.tests.outcome }}"
          NEW_COUNT="${{ steps.merge.outputs.new_count }}"
          UPSTREAM_SHA="${{ steps.merge.outputs.upstream_sha }}"
          MERGE_BASE="${{ steps.merge.outputs.merge_base }}"

          {
            echo "## Automated Upstream Sync from \`nukeop/nuclear\`"
            echo ""
            echo "- **Upstream commits:** ${NEW_COUNT} new commits since \`${MERGE_BASE}\` (up to \`${UPSTREAM_SHA}\`)"
            echo "- **Merge status:** Clean merge — zero fork files were overwritten"
            echo "- **Player tests (\`pnpm --filter @nuclearplayer/player test\`):** \`${TEST_OUTCOME}\`"
            echo ""
            echo "## New Upstream Commits"
            cat /tmp/upstream-commits.md
          } > /tmp/pr-body.md

          TITLE="chore(upstream): sync ${NEW_COUNT} commits from nukeop/nuclear (${UPSTREAM_SHA})"
          PR_NUM=$(gh pr list --head upstream-sync --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUM" ]; then
            gh pr edit "$PR_NUM" --title "$TITLE" --body-file /tmp/pr-body.md
          else
            gh pr create --base main --head upstream-sync --label upstream-sync --title "$TITLE" --body-file /tmp/pr-body.md
          fi

          PR_URL=$(gh pr view upstream-sync --json url --jq '.url')
          ISSUE_NUM=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE_NUM" ]; then
            gh issue close "$ISSUE_NUM" --comment "Upstream changes now merge cleanly in ${PR_URL}."
          fi

      - name: Open or update conflict tracking issue
        if: steps.merge.outputs.status == 'conflicts'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create upstream-sync --color 1D76DB --description "Automated upstream sync from nukeop/nuclear" --force

          NEW_COUNT="${{ steps.merge.outputs.new_count }}"
          UPSTREAM_SHA="${{ steps.merge.outputs.upstream_sha }}"
          MERGE_BASE="${{ steps.merge.outputs.merge_base }}"
          CLEAN_COUNT="${{ steps.merge.outputs.clean_count }}"

          {
            echo "## Upstream Sync Report (\`nukeop/nuclear\`)"
            echo ""
            echo "- **New commits:** ${NEW_COUNT} commits from \`nukeop/nuclear\` since \`${MERGE_BASE}\` (up to \`${UPSTREAM_SHA}\`)"
            echo "- **Files that merge cleanly:** ${CLEAN_COUNT}"
            echo "- **Protection status:** Merge conflicts were detected in shared files, so \`main\` was **not** modified and zero fork files were overwritten."
            echo ""
            cat /tmp/conflict-details.md
            echo ""
            echo "## New Upstream Commits"
            cat /tmp/upstream-commits.md
            echo ""
            echo "## Resolve Locally"
            echo "\`\`\`bash"
            echo "git fetch upstream"
            echo "git checkout -b upstream-sync main"
            echo "git merge upstream/master"
            echo "# Resolve conflicts while keeping fork features, then run tests and merge into main"
            echo "\`\`\`"
          } > /tmp/issue-body.md

          TITLE="Upstream sync: ${NEW_COUNT} new commits from nukeop/nuclear (conflicts need review)"
          ISSUE_NUM=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE_NUM" ]; then
            gh issue edit "$ISSUE_NUM" --title "$TITLE" --body-file /tmp/issue-body.md
          else
            gh issue create --label upstream-sync --title "$TITLE" --body-file /tmp/issue-body.md
          fi
