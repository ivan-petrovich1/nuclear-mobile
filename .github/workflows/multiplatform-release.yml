name: Multi-Platform Release Builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v1.0.7)"
        required: true
        type: string
      targets:
        description: "Which platform(s) to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - linux-x64
          - linux-arm64
          - windows-x64
          - macos
          - macos-arm64
          - macos-x64

permissions:
  contents: write

env:
  DO_NOT_TRACK: 1
  CARGO_INCREMENTAL: 0

jobs:
  build-desktop:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.targets == 'all' ||
      inputs.targets == 'linux-x64' ||
      inputs.targets == 'linux-arm64' ||
      inputs.targets == 'windows-x64'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux x86_64 (Ubuntu 22.04 / glibc 2.35)"
            runner: "ubuntu-22.04"
            kind: "linux-x64"
          - name: "Linux ARM64 (Ubuntu 22.04 / glibc 2.35)"
            runner: "ubuntu-22.04-arm"
            kind: "linux-arm64"
          - name: "Windows x64"
            runner: "windows-latest"
            kind: "windows-x64"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Skip unselected target
        id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.targets }}" != "all" ] && [ "${{ inputs.targets }}" != "${{ matrix.kind }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "release" ] && [ "${{ matrix.kind }}" != "linux-arm64" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.select.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Determine release tag
        if: steps.select.outputs.run == 'true'
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install & cache Linux system dependencies (with clang + lld fast linker)
        if: steps.select.outputs.run == 'true' && runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libappindicator3-dev
            librsvg2-dev
            libdbus-1-dev
            libssl-dev
            patchelf
            gstreamer1.0-libav
            gstreamer1.0-plugins-base
            gstreamer1.0-plugins-good
            file
            wget
            clang
            lld
          version: 2.0

      - name: Setup PNPM
        if: steps.select.outputs.run == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.select.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install JS dependencies
        if: steps.select.outputs.run == 'true'
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Cache Turborepo & Tauri bundler tools
        if: steps.select.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            ~/.cache/tauri
          key: tauri-turbo-${{ matrix.kind }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            tauri-turbo-${{ matrix.kind }}-

      - name: Setup Rust
        if: steps.select.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        if: steps.select.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/player/src-tauri -> target
          shared-key: "release-v2-${{ matrix.kind }}"

      - name: Build workspace packages
        if: steps.select.outputs.run == 'true'
        shell: bash
        run: pnpm turbo build --filter='@nuclearplayer/player^...'

      - name: Build Linux x86_64 (.deb, .rpm, .AppImage)
        if: steps.select.outputs.run == 'true' && matrix.kind == 'linux-x64'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: |
          pnpm --filter @nuclearplayer/player tauri build --bundles deb,rpm,appimage
          mkdir -p dist-assets
          cp packages/player/src-tauri/target/release/bundle/appimage/*.AppImage dist-assets/Nuclear-Release-x86_64.AppImage
          cp packages/player/src-tauri/target/release/bundle/deb/*.deb dist-assets/Nuclear-Linux-amd64.deb
          cp packages/player/src-tauri/target/release/bundle/rpm/*.rpm dist-assets/Nuclear-Linux-x86_64.rpm

      - name: Build Linux ARM64 (.deb, .rpm, .AppImage)
        if: steps.select.outputs.run == 'true' && matrix.kind == 'linux-arm64'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: "aarch64"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: |
          pnpm --filter @nuclearplayer/player tauri build --bundles deb,rpm
          mkdir -p dist-assets
          cp packages/player/src-tauri/target/release/bundle/deb/*.deb dist-assets/Nuclear-Linux-arm64.deb
          cp packages/player/src-tauri/target/release/bundle/rpm/*.rpm dist-assets/Nuclear-Linux-aarch64.rpm
          if pnpm --filter @nuclearplayer/player tauri build --bundles appimage --config '{"bundle":{"linux":{"appimage":{"bundleMediaFramework":false}}}}'; then
            cp packages/player/src-tauri/target/release/bundle/appimage/*.AppImage dist-assets/Nuclear-Linux-arm64.AppImage
          else
            tar -czf dist-assets/Nuclear-Linux-arm64.tar.gz -C packages/player/src-tauri/target/release nuclear-music-player
          fi

      - name: Build Windows x64 (.exe NSIS & .msi)
        if: steps.select.outputs.run == 'true' && matrix.kind == 'windows-x64'
        shell: bash
        run: |
          pnpm --filter @nuclearplayer/player tauri build --bundles nsis,msi
          mkdir -p dist-assets
          cp packages/player/src-tauri/target/release/bundle/nsis/*-setup.exe dist-assets/Nuclear-Windows-x64-setup.exe
          cp packages/player/src-tauri/target/release/bundle/msi/*.msi dist-assets/Nuclear-Windows-x64.msi

      - name: Upload packages to GitHub Release
        if: steps.select.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist-assets/
          gh release upload "${{ steps.meta.outputs.tag }}" dist-assets/* --clobber

  build-macos:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.targets == 'all' ||
      inputs.targets == 'macos' ||
      inputs.targets == 'macos-arm64' ||
      inputs.targets == 'macos-x64'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS Apple Silicon (arm64)"
            kind: "macos-arm64"
            target: "aarch64-apple-darwin"
            asset: "Nuclear-macOS-arm64.dmg"
          - name: "macOS Intel (x64)"
            kind: "macos-x64"
            target: "x86_64-apple-darwin"
            asset: "Nuclear-macOS-x64.dmg"

    name: ${{ matrix.name }}
    runs-on: macos-latest

    steps:
      - name: Skip unselected target
        id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.targets }}" != "all" ] && [ "${{ inputs.targets }}" != "macos" ] && [ "${{ inputs.targets }}" != "${{ matrix.kind }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.select.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Determine release tag
        if: steps.select.outputs.run == 'true'
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PNPM
        if: steps.select.outputs.run == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.select.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install JS dependencies
        if: steps.select.outputs.run == 'true'
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Cache Turborepo build outputs
        if: steps.select.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ matrix.kind }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ matrix.kind }}-

      - name: Setup Rust
        if: steps.select.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        if: steps.select.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/player/src-tauri -> target
          shared-key: "release-v2-${{ matrix.target }}"

      - name: Build workspace packages
        if: steps.select.outputs.run == 'true'
        shell: bash
        run: pnpm turbo build --filter='@nuclearplayer/player^...'

      - name: Build macOS (.dmg)
        if: steps.select.outputs.run == 'true'
        shell: bash
        run: |
          pnpm --filter @nuclearplayer/player tauri build --bundles dmg --target "${{ matrix.target }}"
          mkdir -p dist-assets
          cp "packages/player/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg "dist-assets/${{ matrix.asset }}"

      - name: Upload macOS DMG to GitHub Release
        if: steps.select.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist-assets/
          gh release upload "${{ steps.meta.outputs.tag }}" dist-assets/* --clobber
